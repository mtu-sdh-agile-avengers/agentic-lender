# Continuous integration: every pull request and every push to main.
# Free for public repositories on GitHub-hosted runners. Nothing is deployed here
# (see deploy.yml, which only runs when someone starts it).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai:
    name: AI engine · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  api:
    name: AL-Core · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      RUN_MODE: dev
      CORS_ORIGINS: "[]"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv python install # version from api/.python-version
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    name: AL-Web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: AL-Mobile · build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # committed from Windows, so the executable bit may be missing
      - run: chmod +x gradlew
      # no google-services.json in CI: the app builds in emulator mode
      - run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: al-mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  stack:
    name: Docker stack · smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build images
        run: docker compose build firebase api ai
      - name: Build the production web image (what deploy.yml ships)
        run: docker build -t al-web web
      - name: Start emulators, AI engine and AL-Core
        run: docker compose up -d --wait --wait-timeout 300 firebase ai api
      - name: Seed demo accounts
        run: docker compose run --rm seed
      - name: Sign-in chain and service wiring
        run: bash infra/ci/smoke-test.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color firebase ai api seed
      - name: Stop
        if: always()
        run: docker compose down -v

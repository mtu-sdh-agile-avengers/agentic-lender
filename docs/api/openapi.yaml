openapi: 3.1.0
info:
  title: AL-Core
  description: REST API for Agentic Lender.
  version: 0.3.0
paths:
  /:
    get:
      tags:
      - root
      summary: Root
      description: Redirects to "/health".
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      tags:
      - health
      summary: Health
      description: Returns server status if it's available.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/dependencies:
    get:
      tags:
      - health
      summary: Health Dependencies
      description: 'Checks availability of required services. AI engine: reachable, X-Internal-Key accepted, model loaded.'
      operationId: health_dependencies_health_dependencies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/users/me:
    get:
      tags:
      - users
      summary: Get Me
      description: Returns user profile record if it exists.
      operationId: get_me_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Not Found
          detail: User profile not found.
      security:
      - HTTPBearer: []
    post:
      tags:
      - users
      summary: Create Me
      description: Creates user profile record in database.
      operationId: create_me_api_v1_users_me_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/UserCreateBody'
              - type: 'null'
              title: Data
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Conflict
          detail: User profile already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/loan-applications:
    post:
      tags:
      - loan-applications
      summary: Submit Loan Application
      description: Submits a new loan application (retail borrower).
      operationId: submit_loan_application_api_v1_loan_applications_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationCreateBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - loan-applications
      summary: Get Loan Applications List
      description: Returns loan applications of the caller, newest first.
      operationId: get_loan_applications_list_api_v1_loan_applications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: page number (starting from 1)
          default: 1
          title: Page
        description: page number (starting from 1)
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 15
          title: Pagesize
      - name: unclaimedOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unclaimedonly
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LoanApplicationStatus'
          - type: 'null'
          title: Status
      - name: ltvGroup
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/LtvGroup'
          - type: 'null'
          title: Ltvgroup
      - name: riskTier
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RiskTier'
          - type: 'null'
          title: Risktier
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_LoanApplicationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}:
    get:
      tags:
      - loan-applications
      summary: Get Loan Application
      description: 'Returns the loan file (dossier) of an application: financials, property, status history, the borrower''s
        contact details, attached documents and a summary of the latest AI committee run. 403 if the application is not one
        of the caller''s (referred clients for a broker, portfolio for a bank officer, own applications for a borrower); 404
        if it does not exist.'
      operationId: get_loan_application_api_v1_loan_applications__loan_application_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanFileResponse'
        '403':
          description: Not one of the caller's applications
        '404':
          description: Loan application does not exist
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/broker:
    put:
      tags:
      - loan-applications
      summary: Claim Loan Application
      description: Allows mortgage brokers to assign themselves to an unclaimed loan application.
      operationId: claim_loan_application_api_v1_loan_applications__loan_application_id__broker_put
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - loan-applications
      summary: Release Broker
      description: Allows assigned mortgage brokers return claimed loan application.
      operationId: release_broker_api_v1_loan_applications__loan_application_id__broker_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/bank-officer:
    put:
      tags:
      - loan-applications
      summary: Assign Bank Officer
      description: Allows bank officer to be assigned by broker to an unclaimed (by bank officer) loan application.
      operationId: assign_bank_officer_api_v1_loan_applications__loan_application_id__bank_officer_put
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankOfficerAssignBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - loan-applications
      summary: Release Bank Officer
      description: Allows bank officer to return loan application.
      operationId: release_bank_officer_api_v1_loan_applications__loan_application_id__bank_officer_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/decision:
    post:
      tags:
      - loan-applications
      summary: Make Decision
      description: Allows assigned bank officer to make final lending decision (approve or decline) for loan application.
      operationId: make_decision_api_v1_loan_applications__loan_application_id__decision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnderwritingDecisionCreateBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/withdrawal:
    post:
      tags:
      - loan-applications
      summary: Withdraw Loan Application
      description: Allows borrower to withdraw (i.e., cancel) loan application if it's still open, before landing decision.
      operationId: withdraw_loan_application_api_v1_loan_applications__loan_application_id__withdrawal_post
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations:
    post:
      tags:
      - conversations
      summary: Open Conversation
      description: 'Opens the borrower''s conversation about one of their applications with the broker or assigned bank officer).
        Idempotent: an existing conversation is returned.'
      operationId: open_conversation_api_v1_conversations_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        '404':
          detail: Loan application not found
          description: Not Found
        '409':
          detail: No broker or officer assigned
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - conversations
      summary: List Conversations
      description: 'Inbox of the current user: conversations they take part in, most recent activity first.'
      operationId: list_conversations_api_v1_conversations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationResponse'
                title: Response List Conversations Api V1 Conversations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}/messages:
    post:
      tags:
      - conversations
      summary: Send Message
      description: 'Sends a message (reply) to the conversation. Any participant: borrower, broker or officer.'
      operationId: send_message_api_v1_conversations__conversation_id__messages_post
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          detail: Conversation not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - conversations
      summary: List Messages
      description: Returns messages of a conversation, oldest first. Without `before` returns the latest page and marks the
        conversation as read; pass the `created_at` of the oldest message as `before` to load older ones.
      operationId: list_messages_api_v1_conversations__conversation_id__messages_get
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Before
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
                title: Response List Messages Api V1 Conversations  Conversation Id  Messages Get
        '404':
          detail: Conversation not found
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/assessments:
    post:
      tags:
      - assessments
      summary: Request Assessment
      description: Starts an AI committee run (assigned broker or bank officer). Returns at once with status `queued`;poll
        `GET .../assessments/latest`. If a run is already in progress, that run is returned.
      operationId: request_assessment_api_v1_loan_applications__loan_application_id__assessments_post
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/loan-applications/{loan_application_id}/assessments/latest:
    get:
      tags:
      - assessments
      summary: Get Latest Assessment
      description: 'Get latest AI committee run: decision, each model''s vote and reason, the agents'' reasoning steps in
        order, and the verified figures (affordability, collateral, risk).'
      operationId: get_latest_assessment_api_v1_loan_applications__loan_application_id__assessments_latest_get
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stress-tests:
    post:
      tags:
      - stress-tests
      summary: Run Stress Test
      description: 'Runs a scenario over the caller''s portfolio: central bank rate shock (`rateShockBps`) and/or property
        market downturn (`priceChangePercent`). Shows which borrowers could no longer afford repayments or would be in negative
        equity. The run is saved.'
      operationId: run_stress_test_api_v1_stress_tests_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StressTestCreateBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - stress-tests
      summary: Get Stress Tests
      description: Returns the caller's previous stress tests, newest first (without per-borrower results).
      operationId: get_stress_tests_api_v1_stress_tests_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StressTestListItemResponse'
                title: Response Get Stress Tests Api V1 Stress Tests Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/stress-tests/{stress_test_id}:
    get:
      tags:
      - stress-tests
      summary: Get Stress Test
      description: Return one of the caller's stress tests with per-borrower results.
      operationId: get_stress_test_api_v1_stress_tests__stress_test_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: stress_test_id
        in: path
        required: true
        schema:
          type: string
          title: Stress Test Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/support-tickets:
    post:
      tags:
      - support-tickets
      summary: Submit Support Ticket
      description: Submits a support request (retail borrower). `loanApplicationId` is required for the `loan_application`
        category and must be one of the borrower's own applications.
      operationId: submit_support_ticket_api_v1_support_tickets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTicketCreateBody'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketResponse'
        '404':
          description: Loan application not found among the borrower's
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/reviews:
    post:
      tags:
      - reviews
      summary: Submit Review
      description: Rates the service from 1 (worst) to 5 (best), with an optional comment (retail borrower).
      operationId: submit_review_api_v1_reviews_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateBody'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/loan-applications/{loan_application_id}/audit-pack:
    get:
      tags:
      - audit-packs
      summary: Download Audit Pack
      description: 'Downloads the audit pack of a decided loan application (assigned bank officer): the application, borrower,
        status history, lending decision, the AI committee''s decision, votes, verified figures and reasoning steps, and a
        SHA-256 fingerprint of the record (also in the `X-Audit-Pack-SHA256` header). `format=pdf` (default) or `format=csv`.'
      operationId: download_audit_pack_api_v1_loan_applications__loan_application_id__audit_pack_get
      security:
      - HTTPBearer: []
      parameters:
      - name: loan_application_id
        in: path
        required: true
        schema:
          type: string
          title: Loan Application Id
      - name: format
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/AuditPackFormat'
          default: pdf
      responses:
        '200':
          description: The audit pack as a file attachment
          content:
            application/pdf: {}
            text/csv: {}
        '403':
          description: The bank officer is not assigned to the application
        '404':
          description: Loan application does not exist
        '409':
          description: No lending decision has been made yet
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AIDecision:
      type: string
      enum:
      - Approve
      - Conditionally Approve
      - Decline
      - Unavailable
      - Error
      title: AIDecision
    AgentStepResponse:
      properties:
        stepNumber:
          type: integer
          title: Stepnumber
        agent:
          type: string
          title: Agent
        summary:
          type: string
          title: Summary
      type: object
      required:
      - stepNumber
      - agent
      - summary
      title: AgentStepResponse
    AssessmentResponse:
      properties:
        assessmentId:
          type: string
          title: Assessmentid
        loanApplicationId:
          type: string
          title: Loanapplicationid
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        ratePercent:
          type: number
          title: Ratepercent
        decision:
          anyOf:
          - $ref: '#/components/schemas/DecisionResponse'
          - type: 'null'
        affordability:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Affordability
        collateral:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Collateral
        risk:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Risk
        steps:
          items:
            $ref: '#/components/schemas/AgentStepResponse'
          type: array
          title: Steps
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        createdAt:
          type: string
          format: date-time
          title: Createdat
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finishedat
      type: object
      required:
      - assessmentId
      - loanApplicationId
      - status
      - ratePercent
      - decision
      - affordability
      - collateral
      - risk
      - steps
      - error
      - createdAt
      - finishedAt
      title: AssessmentResponse
      description: 'Response of `POST .../assessments` and `GET .../assessments/latest`: the verdict and how it was reached.'
    AssessmentStatus:
      type: string
      enum:
      - queued
      - running
      - done
      - failed
      title: AssessmentStatus
      description: State of an AI committee run; mirrors the AL-AI Engine job status.
    AssessmentSummaryResponse:
      properties:
        assessmentId:
          type: string
          title: Assessmentid
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        decision:
          anyOf:
          - $ref: '#/components/schemas/AIDecision'
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        automatic:
          type: boolean
          title: Automatic
        riskTier:
          anyOf:
          - $ref: '#/components/schemas/RiskTier'
          - type: 'null'
        riskScore:
